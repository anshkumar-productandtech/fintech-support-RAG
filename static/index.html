<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1F20" media="(prefers-color-scheme: dark)">
<title>Kuberix Help</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%20%3Cpath%20d%3D%22M12%204.5h15.5a9%209%200%200%201%209%209v7.5a9%209%200%200%201-9%209H15.5l-6.6%205.6c-.6.5-1.4.1-1.4-.7v-5.3A9%209%200%200%201%203%2021v-7.5a9%209%200%200%201%209-9z%22%20fill%3D%22%23E8A33D%22/%3E%20%3Cpath%20d%3D%22M13.8%2010.6h11.4M13.8%2015.1h11.4M17.4%2010.6c3.1%200%204.8%201.7%204.8%204.4s-1.7%204.6-4.8%204.6h-3.4l7.6%206.6%22%20fill%3D%22none%22%20stroke%3D%22%230F3D3E%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%20%3Cpath%20d%3D%22M34.2%201.2l1.2%203%203%201.2-3%201.2-1.2%203-1.2-3-3-1.2%203-1.2z%22%20fill%3D%22%238FD3C8%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --brand: #0F3D3E; --brand-2: #175759; --marigold: #E8A33D;
    --canvas: #EEF2F1; --surface: #FFFFFF; --surface-2: #F5F8F7; --chip: #E2ECEA;
    --text: #17201F; --muted: #5B6B69; --line: rgba(15, 61, 62, .12);
    --glass: rgba(15, 61, 62, .86); --glass-bar: rgba(255, 255, 255, .78);
    --ready: #1F7A55; --ready-bg: #E4F3EB;
    --review: #8A5A00; --review-bg: #FCF0D4;
    --escalate: #3F3A8C; --escalate-bg: #ECEBFA;
    --error: #9B2C2C; --error-bg: #FBE9E9;
    --shadow: 0 1px 2px rgba(15, 30, 30, .06), 0 8px 24px rgba(15, 30, 30, .06);
    /* Apple-like springs (damping ~0.75) */
    --spring: linear(0, .098, .303, .524, .715, .858, .952, 1.006, 1.032, 1.038, 1.035, 1.027, 1.019, 1.011, 1.006, 1.002, 1, .999, 1);
    --spring-snappy: linear(0, .139, .396, .635, .81, .92, .98, 1.006, 1.015, 1.014, 1.011, 1.007, 1.004, 1.002, 1.001, 1);
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Manrope", system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #8FD3C8; --brand-2: #1E3B3D; --canvas: #0B1213; --surface: #141D1E; --surface-2: #1A2526; --chip: #23393A;
      --text: #E8EFEE; --muted: #93A6A4; --line: rgba(255, 255, 255, .09);
      --glass: rgba(11, 31, 32, .82); --glass-bar: rgba(20, 29, 30, .78);
      --ready: #7FD6AA; --ready-bg: #12291F; --review: #F2C46B; --review-bg: #2C230F;
      --escalate: #B9B4FF; --escalate-bg: #1F1D3A; --error: #F2A1A1; --error-bg: #2E1616;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--canvas);
    font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .app { position: relative; height: 100dvh; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; background: var(--canvas); overflow: hidden; }
  @media (min-width: 769px) { body { background: color-mix(in srgb, var(--canvas) 85%, #000); } .app { box-shadow: 0 0 0 1px var(--line); } }

  /* ---------- Header (frosted glass) ---------- */
  header { position: absolute; inset: 0 0 auto; z-index: 5; color: #fff;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 12px;
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  @media (prefers-color-scheme: dark) { header { border-bottom: 1px solid var(--line); } }
  .bar { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
  .mark { width: 40px; height: 40px; flex: none; }
  .mark svg, .avatar svg { width: 100%; height: 100%; display: block; }
  .avatar { width: 30px; height: 30px; flex: none; margin-top: 2px; animation: pop .45s var(--spring) both; }
  .row:not(.me) { gap: 8px; align-items: flex-start; }
  .row > .card, .row > .bot { max-width: calc(100% - 44px); }
  .titles { flex: 1; min-width: 0; }
  .titles h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  @media (max-width: 420px) { header:has(#newChat:not([hidden])) .titles p { display: none; } }
  .titles p { margin: 0; font-size: 12.5px; color: rgba(255, 255, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer;
    transition: background .15s, transform .1s var(--ease-out), opacity .2s; }
  .icon-btn:hover { background: rgba(255, 255, 255, .1); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn[hidden] { display: none; }

  .bar { margin-bottom: 0; }
  .aud-pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; border: 0; cursor: pointer;
    background: rgba(255, 255, 255, .14); color: #fff; font-size: 14px; font-weight: 600;
    transition: transform .1s var(--ease-out), background .15s, opacity .25s; animation: pop .5s var(--spring) both; }
  .aud-pill:hover { background: rgba(255, 255, 255, .22); }
  .aud-pill:active { transform: scale(.94); }
  .aud-pill[hidden] { display: none; }
  .aud-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--marigold); }
  .aud-pill.merchant .dot { background: #8FD3C8; }

  /* ---------- Conversation ---------- */
  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: var(--head-h, 140px) 12px 12px; scroll-padding-top: var(--head-h, 140px); }
  .empty { padding: 26px 6px 8px; }
  .empty h2 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; }
  .empty p { margin: 0 0 22px; color: var(--muted); font-size: 15px; max-width: 32em; }
  .suggest { display: grid; gap: 8px; }
  .suggest button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 52px;
    cursor: pointer; box-shadow: var(--shadow); transition: transform .12s var(--ease-out), background .15s;
    animation: rise .55s var(--spring) both; animation-delay: calc(var(--i) * 55ms + 80ms); }
  .suggest button:active { transform: scale(.97); background: var(--surface-2); }
  .suggest small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .empty.leaving { animation: fadeOut .2s ease-in forwards; }

  .row { display: flex; margin: 12px 0; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 84%; padding: 10px 14px; border-radius: 20px 20px 6px 20px; color: #fff; background: #0F3D3E;
    white-space: pre-wrap; overflow-wrap: anywhere; transform-origin: 100% 100%; animation: pop .5s var(--spring) both; }
  @media (prefers-color-scheme: dark) { .bubble { background: #1E5557; } }
  .bubble small { display: block; margin-top: 3px; font-size: 12px; color: rgba(255, 255, 255, .65); }

  .card { width: 100%; max-width: 92%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px 18px 18px 18px;
    box-shadow: var(--shadow); overflow: hidden; transform-origin: 0 0; animation: arrive .6s var(--spring) both; }
  .status { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 13.5px; font-weight: 700; }
  .status svg { flex: none; }
  .ready .status { background: var(--ready-bg); color: var(--ready); }
  .review .status { background: var(--review-bg); color: var(--review); }
  .escalate .status { background: var(--escalate-bg); color: var(--escalate); }
  .error .status { background: var(--error-bg); color: var(--error); }
  .ready .status svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .25s var(--ease-out) forwards; }
  .reasons { margin: 0; padding: 0 14px 10px 38px; background: var(--review-bg); color: var(--review); font-size: 14px; }
  .reasons li { margin: 2px 0; }
  .body { padding: 12px 14px 2px; overflow-wrap: anywhere; }
  .body > * { animation: rise .5s var(--spring) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }
  .body p { margin: 0 0 10px; }
  .body ul { margin: 0 0 10px; padding-left: 20px; }
  .note { padding: 12px 14px 4px; }
  .note p { margin: 0 0 8px; }
  .note .hint { color: var(--muted); font-size: 14px; }

  .cite { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 5px; margin: 0 1px; border: 0; border-radius: 7px;
    background: var(--chip); color: var(--brand); font-size: 12px; font-weight: 700; vertical-align: 1px; cursor: pointer;
    transition: transform .1s var(--ease-out), background .15s; }
  .cite:active { transform: scale(.88); }
  .cite.bad { background: var(--review-bg); color: var(--review); text-decoration: line-through; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 14px 12px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--brand);
    font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    transition: transform .1s var(--ease-out), background .2s, color .2s; }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: #0F3D3E; border-color: transparent; color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { background: #8FD3C8; color: #0B1F20; } }
  .btn.done { background: var(--ready); color: #fff; }
  .btn .lbl { display: inline-block; }
  .btn.swap .lbl { animation: swap .35s var(--spring); }

  /* Sources disclosure: animate opacity/transform, never height */
  .sources { border-top: 1px solid var(--line); }
  .sources > button { width: 100%; min-height: 46px; padding: 0 14px; border: 0; background: transparent; color: var(--brand);
    display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .sources > button:active { background: var(--surface-2); }
  .chev { transition: transform .4s var(--spring); }
  .sources[data-open] .chev { transform: rotate(180deg); }
  .src-list { display: none; padding: 0 10px 10px; }
  .sources[data-open] .src-list { display: block; }
  .src { margin-top: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 14px;
    animation: rise .45s var(--spring) both; animation-delay: calc(var(--i) * 35ms); }
  .src b { display: block; font-weight: 700; }
  .src span { color: var(--muted); }
  .src.hit { animation: hit 1.2s var(--ease-out); box-shadow: inset 0 0 0 2px var(--brand); }
  .thanks { margin: 0; font-size: 14px; color: var(--muted); animation: rise .4s var(--spring) both; }
  .thanks strong { color: var(--text); }

  /* Copilot's own messages (the first question) */
  .bot { max-width: 88%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px 20px 20px 20px; padding: 12px 14px;
    box-shadow: var(--shadow); transform-origin: 0 0; animation: arrive .55s var(--spring) both; }
  .bot h2 { margin: 0 0 2px; font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em; }
  .bot p { margin: 0; color: var(--muted); font-size: 15px; }
  .choices { display: grid; gap: 10px; margin-top: 12px; }
  .choice { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 64px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s var(--ease-out), background .15s, border-color .15s; animation: rise .5s var(--spring) both; animation-delay: calc(var(--i) * 70ms + 150ms); }
  .choice:active { transform: scale(.97); background: var(--surface-2); }
  .choice[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .choice .ic { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; }
  .choice .ic.c { background: #FCEBCB; color: #8A5A00; }
  .choice .ic.m { background: #D9EFEB; color: #0F3D3E; }
  @media (prefers-color-scheme: dark) { .choice .ic.c { background: #3A2E14; color: #F2C46B; } .choice .ic.m { background: #183A3B; color: #8FD3C8; } }
  .choice b { display: block; font-size: 16px; }
  .choice small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
  .choice .arrow { margin-left: auto; color: var(--muted); }
  .divider { flex: 1; display: flex; align-items: center; gap: 10px; margin: 16px 4px; color: var(--muted); font-size: 12.5px; animation: rise .4s var(--spring) both; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* iOS-style bottom sheet */
  .scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, .32); animation: fadeIn .25s ease-out both; }
  .scrim[hidden], .sheet[hidden] { display: none; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--canvas); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); animation: sheetUp .5s var(--spring) both; }
  .sheet.closing { animation: sheetDown .22s ease-in forwards; }
  .scrim.closing { animation: fadeOut .22s ease-in forwards; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 12px; }
  .sheet h3 { margin: 0 0 2px 4px; font-size: 17px; font-weight: 700; }
  .sheet .choices { margin-bottom: 10px; }
  .btn.ghost { width: 100%; justify-content: center; background: transparent; border: 0; color: var(--brand); }

  /* Skeleton while drafting */
  .skeleton { padding: 14px; display: grid; gap: 9px; }
  .skeleton i { display: block; height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, var(--chip) 0%, var(--surface-2) 45%, var(--chip) 90%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  .skeleton i:nth-child(1) { width: 92%; } .skeleton i:nth-child(2) { width: 78%; } .skeleton i:nth-child(3) { width: 55%; }
  .wait { padding: 0 14px 12px; font-size: 13px; color: var(--muted); }
  .wait span { display: inline-block; animation: rise .4s var(--spring) both; }

  /* ---------- Composer (glass bar) ---------- */
  .composer { position: relative; z-index: 4; padding: 10px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--glass-bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line); }
  .composer form { display: flex; align-items: flex-end; gap: 8px; }
  .field { flex: 1; display: flex; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); transition: box-shadow .2s, border-color .2s; }
  .field:focus-within { border-color: transparent; box-shadow: 0 0 0 2px var(--brand); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.4; min-height: 44px; max-height: 140px; padding: 11px 16px; }
  textarea::placeholder { color: var(--muted); }
  textarea:disabled { cursor: not-allowed; }
  .field:has(textarea:disabled) { opacity: .6; }
  textarea:focus-visible { outline: none; }
  .send { width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: #0F3D3E; color: #fff; transition: transform .45s var(--spring), opacity .2s, background .2s; }
  @media (prefers-color-scheme: dark) { .send { background: #8FD3C8; color: #0B1F20; } }
  .send:disabled { transform: scale(.82); opacity: .35; cursor: default; }
  .send:not(:disabled):active { transform: scale(.88); transition-duration: .1s; }
  .send .stop, .send.busy .go { display: none; }
  .send.busy .stop { display: block; }
  .hintline { display: flex; justify-content: space-between; gap: 12px; margin: 6px 6px 0; font-size: 12px; color: var(--muted); }
  #audNote { display: inline-flex; gap: 5px; }

  .toast { position: absolute; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 9; transform: translate(-50%, 16px) scale(.96); opacity: 0;
    padding: 10px 16px; border-radius: 999px; background: rgba(23, 32, 31, .92); color: #fff; font-size: 14px; pointer-events: none;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: transform .45s var(--spring), opacity .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  :focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Keyframes ---------- */
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.9); } }
  @keyframes arrive { from { opacity: 0; transform: translateY(16px) scale(.96); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-6px); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  @keyframes sheetDown { to { transform: translateY(100%); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes swap { from { opacity: 0; transform: translateY(6px) scale(.9); } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @keyframes hit { 0% { background: var(--chip); } 100% { background: var(--surface-2); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header id="head">
    <div class="bar">
      <div class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 4.5h15.5a9 9 0 0 1 9 9v7.5a9 9 0 0 1-9 9H15.5l-6.6 5.6c-.6.5-1.4.1-1.4-.7v-5.3A9 9 0 0 1 3 21v-7.5a9 9 0 0 1 9-9z" fill="#E8A33D"/> <path d="M13.8 10.6h11.4M13.8 15.1h11.4M17.4 10.6c3.1 0 4.8 1.7 4.8 4.4s-1.7 4.6-4.8 4.6h-3.4l7.6 6.6" fill="none" stroke="#0F3D3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> <path d="M34.2 1.2l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#8FD3C8"/></svg></div>
      <div class="titles">
        <h1>Kuberix Help</h1>
        <p>Answers from our help center</p>
      </div>
      <button class="aud-pill" id="audPill" type="button" aria-haspopup="dialog" hidden>
        <span class="dot" aria-hidden="true"></span><span id="audPillText">Customer</span>
        <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="newChat" type="button" aria-label="Start over" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="composer">
    <form id="form">
      <label class="sr" for="q">Your question</label>
      <div class="field"><textarea id="q" rows="1" maxlength="500" placeholder="Ask a question…" enterkeyhint="send"></textarea></div>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="stop" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="3" fill="currentColor"/></svg>
      </button>
    </form>
    <div class="hintline"><span id="audNote">Kuberix never asks for your UPI PIN, OTP or password.</span><span id="count">0/500</span></div>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grab" aria-hidden="true"></div>
    <h3 id="sheetTitle">How do you use Kuberix?</h3>
    <div class="choices" data-where="sheet"></div>
    <button type="button" class="btn ghost" id="sheetCancel">Cancel</button>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(() => {
  const SUGGEST = {
    customer: [
      ["paisa kat gaya but payment failed dikha raha hai, kab wapas aayega?", "Money debited, payment failed"],
      ["My payment is stuck on pending. Should I pay again?", "Pending payment"],
      ["How do I cancel my Netflix AutoPay?", "AutoPay"],
    ],
    merchant: [
      ["Instant settlement ka charge kitna hai?", "Instant settlement"],
      ["When will today's sales reach my bank?", "Settlement time"],
      ["A customer raised a chargeback. What should I do?", "Chargebacks"],
    ],
  };
  const REASONS = {
    invalid_citation: "Cites a source that wasn't sent",
    out_of_scope_product: "Mentions a product Kuberix doesn't offer",
  };
  const ICON = {
    ready: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    review: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9.5 17h-19L12 3.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    escalate: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    copy: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg>',
    check: '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    up: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 11v9H4v-9h3zm0 0l4-8c1.7 0 3 1.3 3 3v3h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>',
    down: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="transform:rotate(180deg)"><path d="M7 11v9H4v-9h3zm0 0l4-8c1.7 0 3 1.3 3 3v3h5a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>',
    retry: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
  };

  const $ = (s, r = document) => r.querySelector(s);
  const chat = $("#chat"), q = $("#q"), send = $("#send"), form = $("#form");
  let audience = null, busy = false, controller = null, msgId = 0;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tap = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); };
  const scrollDown = () => requestAnimationFrame(() => chat.scrollTo({ top: chat.scrollHeight, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
  const audLabel = (a) => (a === "merchant" ? "Business" : "Personal");

  // Keep content clear of the glass header.
  const fitHeader = () => document.documentElement.style.setProperty("--head-h", $("#head").offsetHeight + 4 + "px");
  addEventListener("resize", fitHeader);

  // ---------- Text rendering ----------
  function renderReply(text, nSources, id) {
    const inline = (s) => esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, nums) => nums.split(/\s*,\s*/).map((n) => {
        const bad = +n < 1 || +n > nSources;
        return `<button type="button" class="cite${bad ? " bad" : ""}" data-msg="${id}" data-n="${n}" aria-label="Show source ${n}">${n}</button>`;
      }).join(""));
    const out = []; let list = null;
    for (const raw of String(text).split(/\n/)) {
      const line = raw.trim(), m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (m) { (list ||= []).push(`<li>${inline(m[1])}</li>`); continue; }
      if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
      if (line) out.push(`<p>${inline(line)}</p>`);
    }
    if (list) out.push(`<ul>${list.join("")}</ul>`);
    return out.map((h, i) => h.replace(/^<(p|ul)/, `<$1 style="--i:${i}"`)).join("");
  }
  // What the customer receives: no source numbers, no markdown.
  const plain = (t) => String(t).replace(/\s*\[\d+(?:\s*,\s*\d+)*\]/g, "").replace(/\*\*(.+?)\*\*/g, "$1").replace(/[ \t]+([.,;!?])/g, "$1").trim();

  function normalise(d) {
    return {
      reply: d.reply ?? d.answer ?? d.text ?? "",
      refused: !!d.refused,
      sources: (d.sources || []).map((s, i) => ({ n: s.number ?? s.n ?? i + 1, title: s.title ?? s.article_title ?? "", section: s.section ?? s.heading ?? "", id: s.chunk_id ?? "" })),
      needsReview: !!d.needs_review, reasons: d.review_reasons || [], seconds: d.seconds, cost: d.cost,
    };
  }

  // ---------- Views ----------
  const CHOICE = {
    customer: { title: "I pay with Kuberix", hint: "UPI payments, refunds, KYC, wallet", short: "paying with Kuberix", cls: "c",
      svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    merchant: { title: "I accept payments", hint: "For businesses: settlements, fees, QR, chargebacks", short: "accepting payments", cls: "m",
      svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10l1.5-5h13L20 10M4 10v9h16v-9M4 10c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 2 3s2-1.3 2-3c0 1.7 1.3 3 3 3s3-1.3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>' },
  };
  const choicesHtml = (current) => ["customer", "merchant"].map((a, i) => `<button type="button" class="choice" data-pick="${a}" aria-pressed="${a === current}" style="--i:${i}">
      <span class="ic ${CHOICE[a].cls}">${CHOICE[a].svg}</span><span><b>${CHOICE[a].title}</b><small>${CHOICE[a].hint}</small></span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>`).join("");

  function setComposer(on) {
    q.disabled = !on;
    q.placeholder = on ? "Ask a question…" : "Choose an option above to start";
    update();
  }
  function showStart() {
    audience = null; msgId = 0;
    chat.innerHTML = "";
    $("#audPill").hidden = true; $("#newChat").hidden = true;
    setComposer(false);
    addRow(`<div class="bot">
      <h2>Hi, how do you use Kuberix?</h2>
      <p>I answer from our help center. I'm an AI assistant and can make mistakes, so check anything important with our team.</p>
      <div class="choices" data-where="chat">${choicesHtml(null)}</div></div>`);
  }
  function showStarter() {
    addRow(`<div class="bot" id="starter">
      <p>What can I help with? Ask in English or Hinglish, or tap a common question.</p>
      <div class="suggest" style="margin-top:12px">${SUGGEST[audience].map(([t, label], i) =>
        `<button type="button" data-q="${esc(t)}" style="--i:${i}">${esc(t)}<small>${esc(label)}</small></button>`).join("")}</div></div>`);
  }
  function pick(aud, where) {
    const switching = audience && audience !== aud;
    audience = aud; tap(8);
    const pill = $("#audPill");
    $("#audPillText").textContent = audLabel(aud);
    pill.classList.toggle("merchant", aud === "merchant");
    pill.hidden = false; pill.style.animation = "none"; void pill.offsetWidth; pill.style.animation = "";
    if (where === "chat") {
      const box = $('.choices[data-where="chat"]');
      box.querySelectorAll(".choice").forEach((c) => { c.disabled = true; c.style.animation = "fadeOut .2s ease-in forwards"; });
      setTimeout(() => box.remove(), 200);
      setTimeout(() => {
        addRow(`<div class="bubble">${CHOICE[aud].title}</div>`, true);
        setTimeout(showStarter, 350);
      }, 220);
    } else if (switching) {
      $("#starter")?.remove();
      addRow(`<div class="divider">Now answering questions about ${CHOICE[aud].short}</div>`);
      if (!chat.querySelector(".card")) showStarter();
    }
    setComposer(true);
    if (where !== "chat") q.focus();
  }
  function openSheet() {
    $(".choices", $("#sheet")).innerHTML = choicesHtml(audience);
    $("#scrim").hidden = false; $("#sheet").hidden = false;
    $(".choice", $("#sheet")).focus();
  }
  function closeSheet() {
    const sh = $("#sheet"), sc = $("#scrim");
    sh.classList.add("closing"); sc.classList.add("closing");
    setTimeout(() => { sh.hidden = true; sc.hidden = true; sh.classList.remove("closing"); sc.classList.remove("closing"); $("#audPill").focus(); }, 220);
  }
  const LOGO = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 4.5h15.5a9 9 0 0 1 9 9v7.5a9 9 0 0 1-9 9H15.5l-6.6 5.6c-.6.5-1.4.1-1.4-.7v-5.3A9 9 0 0 1 3 21v-7.5a9 9 0 0 1 9-9z" fill="#E8A33D"/> <path d="M13.8 10.6h11.4M13.8 15.1h11.4M17.4 10.6c3.1 0 4.8 1.7 4.8 4.4s-1.7 4.6-4.8 4.6h-3.4l7.6 6.6" fill="none" stroke="#0F3D3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> <path d="M34.2 1.2l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#8FD3C8"/></svg>`;
  function addRow(html, mine = false) {
    const row = document.createElement("div");
    row.className = "row" + (mine ? " me" : "");
    const avatar = !mine && !html.includes('class="divider"') ? `<span class="avatar">${LOGO}</span>` : "";
    row.innerHTML = avatar + html;
    chat.appendChild(row); scrollDown();
    return row;
  }
  function addMine(text) {
    const starter = $("#starter");
    if (starter) { starter.classList.add("leaving"); starter.style.animation = "fadeOut .2s ease-in forwards"; setTimeout(() => starter.closest(".row")?.remove(), 190); }
    $("#newChat").hidden = false;
    addRow(`<div class="bubble">${esc(text)}</div>`, true);
  }
  function addSkeleton() {
    const row = addRow(`<article class="card" aria-label="Writing an answer">
      <div class="skeleton"><i></i><i></i><i></i></div>
      <div class="wait"><span>Checking our help center…</span></div></article>`);
    const steps = [[3000, "Writing your answer…"], [12000, "Almost there. Some answers take up to 20 seconds."]];
    row._timers = steps.map(([ms, t]) => setTimeout(() => { const w = $(".wait", row); if (w) w.innerHTML = `<span>${t}</span>`; }, ms));
    return row;
  }
  const dropSkeleton = (row) => { row._timers.forEach(clearTimeout); row.remove(); };

  const SUPPORT = `In the Kuberix app, go to <strong>Help &gt; Chat with us</strong>. It's open 24 hours a day for payment issues.`;
  function handoff(tone, title, line) {
    addRow(`<article class="card ${tone}">
      <div class="status">${ICON.escalate} ${title}</div>
      <div class="note"><p>${line}</p><p class="hint">${SUPPORT}</p></div>
      <div class="actions"><button type="button" class="btn" data-again>Ask something else</button></div></article>`);
  }
  function addDraft(d, question, aud) {
    const id = ++msgId;
    if (d.refused) {
      handoff("escalate", "Our support team can help with this", "Our help center doesn't cover this, so I won't guess.");
      return;
    }
    if (d.needsReview) {
      // Safety: an answer our own checks flagged is never shown to the user.
      handoff("review", "Let's get you a reliable answer", "I'm not confident my answer is right, so I'd rather not guess on this one.");
      return;
    }
    const srcs = d.sources.map((s, i) => `<div class="src" id="m${id}s${s.n}" style="--i:${i}"><b>[${s.n}] ${esc(s.title || s.id)}</b>${s.section ? `<span>${esc(s.section)}</span>` : ""}</div>`).join("");
    const row = addRow(`<article class="card ready">
      <div class="status">${ICON.ready} From the Kuberix help center</div>
      <div class="body">${renderReply(d.reply, d.sources.length, id)}</div>
      <div class="actions" data-fb>
        <button type="button" class="btn" data-vote="up" aria-label="This helped">${ICON.up}<span class="lbl">Helpful</span></button>
        <button type="button" class="btn" data-vote="down" aria-label="This didn't help">${ICON.down}<span class="lbl">Not helpful</span></button>
      </div>
      ${d.sources.length ? `<div class="sources" id="m${id}src">
        <button type="button" aria-expanded="false" aria-controls="m${id}list">Based on these help articles ${ICON.chev}</button>
        <div class="src-list" id="m${id}list">${srcs}</div></div>` : ""}</article>`);
    tap(12);
  }
  function addError(message, question) {
    const row = addRow(`<article class="card error">
      <div class="status">${ICON.review} Something went wrong</div>
      <div class="note"><p>${esc(message)}</p></div>
      <div class="actions"><button type="button" class="btn" data-retry>${ICON.retry}<span class="lbl">Try again</span></button></div></article>`);
    $("[data-retry]", row).addEventListener("click", () => { row.remove(); ask(question, true); });
  }

  // Copy button morphs to "Copied" in place: feedback right where the action happened.
  function wireCopy(btn, text, toastMsg) {
    const original = btn.innerHTML;
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); }
      catch { toast("Couldn't copy. Select the text and copy it instead."); return; }
      tap(10);
      btn.classList.add("done", "swap"); btn.innerHTML = `${ICON.check}<span class="lbl">Copied</span>`;
      if (toastMsg) toast(toastMsg);
      clearTimeout(btn._h); btn._h = setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = original; setTimeout(() => btn.classList.remove("swap"), 400); }, 1600);
    });
  }
  function toggleSources(box, open) {
    box.toggleAttribute("data-open", open);
    box.firstElementChild.setAttribute("aria-expanded", String(open));
  }

  // ---------- Flow ----------
  async function ask(text, retry = false) {
    text = text.trim();
    if (busy || !text || !audience) return;
    const aud = audience;
    if (!retry) addMine(text);
    setBusy(true);
    const sk = addSkeleton();
    controller = new AbortController();
    try {
      const res = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text, audience: aud }), signal: controller.signal });
      dropSkeleton(sk);
      if (res.status === 400) addError("Please keep your question under 500 characters.", text);
      else if (!res.ok) addError("We couldn't get an answer just now. Try again in a moment.", text);
      else addDraft(normalise(await res.json()), text, aud);
    } catch (e) {
      dropSkeleton(sk);
      if (e.name === "AbortError") toast("Stopped");
      else addError("You seem to be offline. Check your connection and try again.", text);
    } finally { setBusy(false); controller = null; }
  }
  function setBusy(b) {
    busy = b;
    send.classList.toggle("busy", b);
    send.setAttribute("aria-label", b ? "Stop" : "Send");
    update();
  }
  function update() {
    send.disabled = !busy && (!q.value.trim() || !audience);
    $("#count").textContent = q.value.length > 400 ? `${q.value.length}/500` : "";
  }
  const grow = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; };

  // ---------- Events ----------
  $("#audPill").addEventListener("click", () => { tap(6); openSheet(); });
  $("#sheetCancel").addEventListener("click", closeSheet);
  $("#scrim").addEventListener("click", closeSheet);
  $("#sheet").addEventListener("click", (e) => { const c = e.target.closest("[data-pick]"); if (c) { closeSheet(); pick(c.dataset.pick, "sheet"); } });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
  $("#newChat").addEventListener("click", () => { if (busy) controller?.abort(); tap(6); showStart(); });
  chat.addEventListener("click", (e) => {
    const ch = e.target.closest('[data-where="chat"] [data-pick]'); if (ch && !ch.disabled) { pick(ch.dataset.pick, "chat"); return; }
    const s = e.target.closest("[data-q]"); if (s) { tap(6); ask(s.dataset.q); return; }
    const v = e.target.closest("[data-vote]");
    if (v) {
      const box = v.closest("[data-fb]"); tap(10);
      box.innerHTML = v.dataset.vote === "up"
        ? `<p class="thanks">Thanks, glad that helped.</p>`
        : `<p class="thanks">Thanks for telling us. If you still need help, ${SUPPORT.charAt(0).toLowerCase() + SUPPORT.slice(1)}</p>`;
      return;
    }
    if (e.target.closest("[data-again]")) { q.focus(); return; }
    const toggle = e.target.closest(".sources > button");
    if (toggle) { const box = toggle.parentElement; toggleSources(box, !box.hasAttribute("data-open")); return; }
    const c = e.target.closest(".cite");
    if (c) {
      const box = document.getElementById(`m${c.dataset.msg}src`), src = document.getElementById(`m${c.dataset.msg}s${c.dataset.n}`);
      if (!box || !src) { toast(`Source ${c.dataset.n} wasn't sent with this draft`); return; }
      tap(6); toggleSources(box, true);
      src.classList.remove("hit"); void src.offsetWidth; src.classList.add("hit");
      src.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  });
  q.addEventListener("input", () => { update(); grow(); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (busy) { controller?.abort(); return; }
    const t = q.value; q.value = ""; grow(); update(); tap(8); ask(t);
  });

  fitHeader(); showStart();
  document.fonts?.ready.then(fitHeader);
})();
</script>
</body>
</html>
